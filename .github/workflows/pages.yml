name: Deploy IDE to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build browser IDE
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ide/pnpm-lock.yaml

      - name: Install IDE dependencies
        working-directory: ide
        run: pnpm install --frozen-lockfile

      - name: Test browser IDE
        working-directory: ide
        run: pnpm test -- --run

      - name: Build browser IDE for repository Pages path
        working-directory: ide
        run: |
          pnpm run wasm:build
          pnpm exec vite build --base=/peps/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ide/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
